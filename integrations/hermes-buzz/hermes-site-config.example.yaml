# Site profile settings. Replace all REPLACE_* values.
# Keep secrets in the profile .env file.

display:
  platforms:
    buzz:
      interim_assistant_messages: false
      tool_progress: off

terminal:
  backend: local
  cwd: /ABSOLUTE/PATH/TO/federated-kpi-aggregation
  env_passthrough:
    - FEDERATED_KPI_ROLE
    - FEDERATED_KPI_SITE_CONFIG

gateway:
  platforms:
    buzz:
      enabled: true
      extra:
        relay_url: https://REPLACE_RELAY
        channels:
          - REPLACE_PROTOCOL_CHANNEL_UUID
        home_channel: REPLACE_PROTOCOL_CHANNEL_UUID
        cli_path: /ABSOLUTE/PATH/TO/buzz
        allowed_users:
          - REPLACE_COORDINATOR_NPUB_OR_HEX
        require_mention: false
        allow_all_users: false
        poll_interval: 4
